name: Build tenant mobile app

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant to build
        required: true
        type: choice
        options:
          - siemens
          - climatix
          - cateroillar
          - athena
      deployment_environment:
        description: Deployment environment
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - production
      platform:
        description: Platform to build
        required: true
        type: choice
        default: both
        options:
          - android
          - ios
          - both

permissions:
  contents: read

jobs:
  android:
    name: Android (${{ inputs.tenant }} / ${{ inputs.deployment_environment }})
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    environment: ${{ inputs.tenant }}-${{ inputs.deployment_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Prepare tenant web and native configuration
        run: npm run ci:android -- --tenant=${{ inputs.tenant }} --environment=${{ inputs.deployment_environment }}
      - name: Add Android platform
        run: npx cordova platform add android --no-save
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          npx cordova build android --release -- --keystore="$GITHUB_WORKSPACE/release.keystore" --storePassword="$ANDROID_KEYSTORE_PASSWORD" --alias="$ANDROID_KEY_ALIAS" --password="$ANDROID_KEY_PASSWORD" --packageType=apk
          npx cordova build android --release -- --keystore="$GITHUB_WORKSPACE/release.keystore" --storePassword="$ANDROID_KEYSTORE_PASSWORD" --alias="$ANDROID_KEY_ALIAS" --password="$ANDROID_KEY_PASSWORD" --packageType=bundle
      - name: Verify Android build outputs
        run: |
          find platforms/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print
          test -n "$(find platforms/android/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$(find platforms/android/app/build/outputs -type f -name '*.aab' -print -quit)"
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tenant }}-${{ inputs.deployment_environment }}-android
          path: |
            platforms/android/app/build/outputs/apk/**/*.apk
            platforms/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    name: iOS (${{ inputs.tenant }} / ${{ inputs.deployment_environment }})
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    environment: ${{ inputs.tenant }}-${{ inputs.deployment_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
      - run: npm ci
      - name: Prepare tenant web and native configuration
        run: npm run ci:ios -- --tenant=${{ inputs.tenant }} --environment=${{ inputs.deployment_environment }}
      - name: Add iOS platform
        run: npx cordova platform add ios --no-save
      - name: Build signed IPA
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios build tenant:${{ inputs.tenant }} environment:${{ inputs.deployment_environment }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tenant }}-${{ inputs.deployment_environment }}-ios
          path: artifacts/${{ inputs.tenant }}/${{ inputs.deployment_environment }}/ios/*.ipa
          if-no-files-found: error
